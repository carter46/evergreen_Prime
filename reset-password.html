<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Bloombit | Set New Password</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          "primary": "#ffc105",
          "background-light": "#f8f8f5",
          "background-dark": "#231e0f",
        },
        fontFamily: { "display": ["Space Grotesk"] },
        borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem"},
      },
    },
  }
</script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display min-h-screen flex items-center justify-center p-6">
<div class="w-full max-w-[440px]">
<a class="flex items-center gap-2 mb-8 text-[#1d180c] dark:text-primary" href="/">
<div class="size-8 text-primary">
<svg fill="currentColor" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"><path d="M36.7273 44C33.9891 44 31.6043 39.8386 30.3636 33.69C29.123 39.8386 26.7382 44 24 44C21.2618 44 18.877 39.8386 17.6364 33.69C16.3957 39.8386 14.0109 44 11.2727 44C7.25611 44 4 35.0457 4 24C4 12.9543 7.25611 4 11.2727 4C14.0109 4 16.3957 8.16144 17.6364 14.31C18.877 8.16144 21.2618 4 24 4C26.7382 4 29.123 8.16144 30.3636 14.31C31.6043 8.16144 33.9891 4 36.7273 4C40.7439 4 44 12.9543 44 24C44 35.0457 40.7439 44 36.7273 44Z"></path></svg>
</div>
<h1 class="text-xl font-bold tracking-tight dark:text-white">Bloombit</h1>
</a>
<div id="invalid-token" class="hidden bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-xl p-6 text-center">
<p class="text-red-700 dark:text-red-400 font-medium">Invalid or expired reset link.</p>
<a class="inline-block mt-4 text-sm font-semibold text-primary hover:underline" href="/forgot-password">Request a new link</a>
</div>
<div id="reset-form-wrapper" class="bg-white dark:bg-[#2d2716] p-8 md:p-10 rounded-xl border border-[#eae2cd] dark:border-[#423b26] shadow-sm">
<div class="flex flex-col gap-2 mb-8">
<div class="w-12 h-12 bg-primary/10 rounded-lg flex items-center justify-center mb-2">
<span class="material-symbols-outlined text-primary text-2xl">shield</span>
</div>
<h2 class="text-2xl font-bold leading-tight tracking-tight dark:text-white">Set New Password</h2>
<p class="text-[#a18a45] text-sm leading-relaxed">Almost there! Create a new strong password for your Bloombit account.</p>
</div>
<form id="reset-password-form" class="flex flex-col gap-5">
<input type="hidden" name="token" id="reset-token"/>
<input type="hidden" name="email" id="reset-email"/>
<div class="flex flex-col gap-2">
<label class="text-sm font-semibold text-[#1d180c] dark:text-[#eae2cd]">New Password</label>
<input name="password" class="w-full pl-10 pr-4 py-3 bg-background-light dark:bg-[#1d180c] border border-[#eae2cd] dark:border-[#423b26] rounded-lg focus:outline-none focus:ring-2 focus:ring-primary dark:text-white" placeholder="••••••••" type="password" required minlength="8"/>
</div>
<div class="flex flex-col gap-2">
<label class="text-sm font-semibold text-[#1d180c] dark:text-[#eae2cd]">Confirm Password</label>
<input name="confirm_password" class="w-full pl-10 pr-4 py-3 bg-background-light dark:bg-[#1d180c] border border-[#eae2cd] dark:border-[#423b26] rounded-lg focus:outline-none focus:ring-2 focus:ring-primary dark:text-white" placeholder="••••••••" type="password" required/>
</div>
<div id="reset-password-message" class="text-sm hidden"></div>
<button type="submit" class="w-full mt-2 py-3.5 bg-primary hover:bg-[#e6ae00] text-[#1d180c] font-bold rounded-lg transition-all shadow-lg shadow-primary/10 flex items-center justify-center gap-2">
<span>Update Password</span>
<span class="material-symbols-outlined text-lg">check_circle</span>
</button>
</form>
<div class="mt-8 text-center">
<a class="text-sm font-medium text-[#a18a45] hover:text-[#1d180c] dark:hover:text-primary underline decoration-primary/30 underline-offset-4 transition-colors" href="/login">Back to Login</a>
</div>
</div>
</div>
<script src="/js/app.js"></script>
</body>
</html>
